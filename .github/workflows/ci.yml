name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run offline tests
      env:
        # Dummy unreachable LiteLLM URL — main.py:_validate_environment()
        # hard-exits at module import time when LITELLM_URL is unset, which
        # crashes pytest collection of tests/test_robustness.py. The URL is
        # never actually called by the offline test set; the validator only
        # checks that it is non-empty and not a self-loop on $PORT.
        LITELLM_URL: http://localhost:9999/v1/chat/completions
        LITELLM_MODEL: dummy-offline
        LITELLM_API_KEY: dummy-offline
      run: |
        # Run tests that don't require price data or network
        python -m pytest tests/test_auto_research.py tests/test_robustness.py tests/test_startup_guard.py -v
